[project]
name = "adblock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "protobuf>=7.36.2",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.3",
    "streamlit>=1.67.0",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[project.scripts]
adblock = "adblock:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "modal>=1.6.3",
    "pytest>=9.2.0",
]
